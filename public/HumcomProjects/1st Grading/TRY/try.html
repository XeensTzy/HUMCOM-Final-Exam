<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubbles Avoid Cursor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: black; overflow: hidden; }
        .bubble {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(0, 150, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            transition: transform 0.2s;
        }
    </style>
</head>
<body>
    <script>
        const bubbles = [];
        const numBubbles = 30;

        function createBubble() {
            const bubble = document.createElement("div");
            bubble.classList.add("bubble");
            document.body.appendChild(bubble);
            resetBubble(bubble);
            bubbles.push(bubble);
        }

        function resetBubble(bubble) {
            bubble.style.left = Math.random() * window.innerWidth + "px";
            bubble.style.top = Math.random() * window.innerHeight + "px";
            moveBubble(bubble);
        }

        function moveBubble(bubble) {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            bubble.style.transition = `transform ${2 + Math.random()}s linear`;
            bubble.style.transform = `translate(${x}px, ${y}px)`;
            setTimeout(() => resetBubble(bubble), 3000);
        }

        for (let i = 0; i < numBubbles; i++) {
            createBubble();
        }

        document.addEventListener("mousemove", (event) => {
            bubbles.forEach(bubble => {
                const rect = bubble.getBoundingClientRect();
                const dx = rect.left + rect.width / 2 - event.clientX;
                const dy = rect.top + rect.height / 2 - event.clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 100) {
                    const angle = Math.atan2(dy, dx);
                    const moveX = Math.cos(angle) * 50;
                    const moveY = Math.sin(angle) * 50;
                    bubble.style.transform = `translate(${rect.left + moveX}px, ${rect.top + moveY}px)`;
                }
            });
        });
    </script>
</body>
</html>
