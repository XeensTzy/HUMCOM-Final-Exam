    <body>
        <div class="body">
            <h1 class="header" 
            style=" display: block;
            font-size: 18px;
            font-family: Arial;
            text-decoration: underline;
            font-weight: 1000px;">
            <u><b>Sample Polynomial Expressions</b></u> </p>

            <div class="container">
            <div>
                <pre class="header2"><b><u>Name</u></b></pre>
                <div class="margin"><pre 
                style="margin-bottom: 10px;
                font-family: Arial;
                font-size: 18px;
                font-family: 'Times New Roman';">Monomial</pre></div>

                <div class="margin"><pre 
                    style="margin-bottom: 10px;
                font-family: Arial;
                font-size: 18px;
                font-family: 'Times New Roman';">Binomial</pre></div>

                <div class="margin"><pre 
                    style="margin-bottom: 10px;
                font-family: Arial;
                font-size: 18px;
                font-family: 'Times New Roman';">Trinomial</pre></div>

                <div class="margin" 
                style="margin-bottom: 10px;
                font-family: Arial;
                font-size: 18px;
                font-family: 'Times New Roman';"><pre>Polynomial</pre></div>
            </div>

            <div>
                <pre class="header2"><b><u>Example</u></b></pre>
                <div class="examples"><pre 
                    style="margin-bottom: 10px;
                font-family: Arial;
                font-size: 18px;
                font-family: 'Times New Roman';">(3x <sup>2</sup>y<sup>3</sup>) &divide; 1</pre></div>

                <div><pre 
                    style="margin-bottom: 10px;
                font-family: Arial;
                font-size: 18px;
                font-family: 'Times New Roman';">2xy + 1/2y<sup>2</sup></pre></div>

                <div><pre 
                    style="margin-bottom: 10px;
                font-family: Arial;
                font-size: 18px;
                font-family: 'Times New Roman';">x<sup>3</sup>y<sup>4</sup> + 2x<sup>3</sup>y + xy <sup>2</sup></pre></div>

                <div><pre
                    style="margin-bottom: 10px;
                font-family: Arial;
                font-size: 18px;
                font-family: 'Times New Roman';">6x<sup>4</sup>y + 5x<sup>3</sup>y<sup>2</sup> + 4x<sup>2</sup>y<sup>3</sup> + xy<sup>4</sup> + 7y<sup>5</sup></pre></div>
            </div>

            <div>
                <pre class="header2"><b><u>Note</u></b></pre>
                <div class="margin2"><pre 
                    style="margin-bottom: 10px;
                font-family: Arial;
                font-size: 18px;
                font-family: 'Times New Roman';">Q<sub>1</sub>: One Term (Mono)</pre></div>

                <div class="margin2"><pre 
                    style="margin-bottom: 10px;
                font-family: Arial;
                font-size: 18px;
                font-family: 'Times New Roman';">Q<sub>2</sub>: Two Terms (Bi)</pre></div>

                <div class="margin2"><pre 
                    style="margin-bottom: 10px;
                font-family: Arial;
                font-size: 18px;
                font-family: 'Times New Roman';">Q<sub>3</sub>: Three Term (Tri)</pre></div>

                <div class="margin2"><pre>Q<sub>4</sub>: Many Term (Poly)   </pre></div>
            </div>
            </div>
